<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My ROC Analysis Tool</title>
    <script>
      // Prevent libraries from overwriting window.fetch which is read-only in some environments
      try {
        const originalFetch = window.fetch;
        if (originalFetch) {
          Object.defineProperty(window, 'fetch', {
            configurable: false,
            enumerable: true,
            get: function() { return originalFetch; },
            set: function() { console.warn('Attempt to overwrite window.fetch blocked.'); }
          });
        }
      } catch (e) {
        console.warn('Could not lock window.fetch:', e);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
